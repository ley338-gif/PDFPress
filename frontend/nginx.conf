worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  default_type application/octet-stream;
  # Kein Zugriffs-Log: nginx ist der einzige externe Entry Point (siehe docs/security.md).
  # Ein aktives access_log würde IP-Adresse + aufgerufener Pfad jeder Anfrage dauerhaft über
  # Dockers Log-Treiber auf der Festplatte des Servers landen lassen — im Widerspruch zur
  # Datenschutzerklärung ("kein Access-Log aktiviert"). error_log bleibt für echte Fehler an.
  access_log off;
  sendfile on;
  # Sicherheitsnetz oberhalb des konfigurierbaren Backend-Limits MAX_FILE_SIZE_MB (Default 100 MB).
  # Wird MAX_FILE_SIZE_MB serverseitig erhöht, muss dieser Wert entsprechend mit angehoben werden.
  client_max_body_size 110m;
  server_tokens off;

  # Zusätzliche Verteidigungsebene gegen Upload-/Job-Flooding, unabhängig von einem
  # eventuellen Rate-Limiting auf einem vorgeschalteten Reverse Proxy (z. B. Caddy).
  #
  # Läuft PDFPress hinter einem Reverse Proxy im selben Docker-Netz (siehe
  # docker-compose.proxy.yml), sieht nginx sonst nur die Proxy-IP als
  # $remote_addr — das Limit unten würde dann global statt pro echtem Client
  # greifen. Die Docker-internen Netzbereiche werden daher als vertrauenswürdig
  # für X-Forwarded-For behandelt, damit $binary_remote_addr die tatsächliche
  # Client-IP abbildet.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # "upload" limitiert gezielt das Anlegen neuer Verarbeitungsjobs (teuer: Datei-I/O,
  # PDF-Validierung, OCR-Pipeline). "api" deckt den Rest ab, u. a. das Status-/Seiten-
  # Polling des Frontends (alle 700ms zwei Requests während ein Job läuft, siehe
  # frontend/src/App.tsx) — das braucht spürbar mehr Spielraum als Job-Erstellung,
  # sonst löst schon eine einzelne normale Verarbeitung das Rate-Limit aus.
  limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=180r/m;
  limit_req_status 429;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { add_header Content-Type text/plain; return 200 'ok'; }
    location ~ ^/api/(documents|tools/metadata/strip|tools/images/extract|tools/merge)$ {
      limit_req zone=upload burst=5 nodelay;
      proxy_pass http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 1800s;
    }
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 1800s;
    }
    location / {
      try_files $uri /index.html;
    }
  }
}
